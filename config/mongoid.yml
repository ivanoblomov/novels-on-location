defaults: &defaults
  options:
    raise_not_found_error: true

development:
  clients:
    default:
      database: novels
      hosts:
        - <%= Rails.application.config.main_host %>:27017

test:
  clients:
    default:
      database: novels_on_location_test
      hosts:
        - <%= Rails.application.config.main_host %>:27017

production:
  clients:
    default:
      uri: <%= ENV['MONGODB_URI'] %>
